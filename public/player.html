<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>PokerOK · Мои фишки</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101b17;color:#f1f3ed;font:16px system-ui,sans-serif}main{max-width:460px;margin:auto;padding:32px 20px}small,p{color:#bac9bf;line-height:1.5}h1{font-size:28px;margin-bottom:8px}.card{background:#1b2c23;border:1px solid #344a3c;border-radius:18px;padding:20px;margin:22px 0}label{display:flex;align-items:center;gap:12px;margin:16px 0}.chip{width:28px;height:28px;border-radius:50%;border:2px dashed #fff8}label span:nth-child(2){flex:1}input{width:110px;background:#101b17;border:1px solid #526656;border-radius:10px;color:white;font:20px system-ui;padding:12px}button{width:100%;border:0;border-radius:12px;background:#e4bb62;color:#15231b;padding:16px;font-size:16px;font-weight:700}button:disabled{opacity:.5}#message{white-space:pre-line}#total{font-weight:bold;color:#e4bb62}
</style></head><body><main><small>POKEROK · ОБЩАЯ WI-FI СЕТЬ</small><h1 id="name">Мои фишки</h1><p id="venue">Соединяемся с телефоном ведущего…</p><form id="form" hidden><div class="card" id="chips"></div><p id="total"></p><button id="submit">Отправить ведущему</button></form><p id="message" role="status"></p><p>Ведущий проверит значения и подтвердит результат. Оставайтесь в общей Wi-Fi сети.</p></main><script>
const token=location.hash.slice(1)||sessionStorage.getItem('poker-player-token');if(token)sessionStorage.setItem('poker-player-token',token);history.replaceState(null,'',location.pathname);let room=null;let sending=false;
const colors={white:'#fff',red:'#e74c3c',blue:'#3498db',green:'#2ecc71',black:'#2c3e50',purple:'#9b59b6',yellow:'#f1c40f',pink:'#e91e8a',gray:'#95a5a6'};
const el=id=>document.getElementById(id);
async function request(path,options={}){const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),7000);try{const res=await fetch(path,{...options,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},signal:controller.signal,cache:'no-store'});const data=await res.json();if(!res.ok)throw Error(data.error||'Ошибка соединения');return data;}finally{clearTimeout(timer);}}
function counts(){return [...el('chips').querySelectorAll('input')].map(i=>Number(i.value||0));}
function total(){el('total').textContent='Всего очков: '+counts().reduce((s,n,i)=>s+n*room.chips[i].nominal,0);}
async function load(){try{const data=await request('/api/me');room=data;el('name').textContent=data.player.name;el('venue').textContent=data.venue||'Домашняя игра';el('chips').replaceChildren();data.chips.forEach((chip,i)=>{const label=document.createElement('label');const dot=document.createElement('span');dot.className='chip';dot.style.background=colors[chip.color]||'#888';const nominal=document.createElement('span');nominal.textContent=chip.nominal+' очков';const input=document.createElement('input');input.type='number';input.min='0';input.max='1000000';input.step='1';input.inputMode='numeric';input.placeholder='0';input.setAttribute('aria-label','Количество фишек номиналом '+chip.nominal);input.value=data.counts?.[i]??'';input.addEventListener('input',total);label.append(dot,nominal,input);el('chips').append(label);});el('form').hidden=false;el('submit').disabled=!data.accepting;el('message').textContent=data.accepting?'Введите количество фишек каждого номинала.':'Ведущий проверяет результаты. Приём приостановлен.';total();}catch(e){el('message').textContent='Нет связи с ведущим. Проверьте Wi-Fi и откройте персональный QR-код ещё раз.';}}
el('form').addEventListener('submit',async event=>{event.preventDefault();if(sending)return;const values=counts();if(values.some(n=>!Number.isSafeInteger(n)||n<0||n>1000000)){el('message').textContent='Введите целые количества от 0 до 1 000 000.';return;}sending=true;el('submit').disabled=true;try{await request('/api/chips',{method:'POST',body:JSON.stringify({schema:room.schema,counts:values})});el('message').textContent='Фишки сохранены на телефоне ведущего. Ожидайте подтверждения. Можно исправить значения и отправить снова.';}catch(e){el('message').textContent=e.name==='AbortError'?'Ответ не получен. Повторите отправку — значения не удвоятся.':e.message;}finally{sending=false;el('submit').disabled=false;}});
if(token)load();else el('message').textContent='Откройте персональный QR-код на телефоне ведущего.';
</script></body></html>
